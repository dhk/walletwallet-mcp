name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run mocked, secret-free tests
        env:
          WALLETWALLET_API_KEY: test-not-real
          MCP_AUTH_TOKEN: test-not-real
        run: python -m unittest discover -s tests -v
